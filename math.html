function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function generate(n=9,type='single',ordered=false){let vals=Array.from({length:n},(_,i)=>i+1);if(!ordered)shuffle(vals);let idx=shuffle([...vals.keys()]).slice(0,type==='double'||type==='target'?2:1),missing=idx.map(i=>vals[i]).sort((a,b)=>a-b);return {n,type,vals:vals.map((v,i)=>idx.includes(i)?null:v),answers:type==='target'?[missing[0]]:missing,missing,selected:[]}}

function qHTML(){const q=game.q,title=q.type==='double'?'缺少的两个数字是什么？':q.type==='target'?'缺少的两个数中，较小的是？':q.type==='row'?'这一行缺哪个数？':q.type==='col'?'这一列缺哪个数？':q.type==='box'?'这个小宫格缺哪个数？':'哪个数字躲起来了？';return `<h2>${title}</h2><div class="range">数字范围 1～${q.n}${q.type==='double'?' · 依次点出两个数字，顺序不限':q.type==='target'?' · 只点较小的那个':''}</div><div class="numbers ${q.type==='box'?'box':q.type==='col'?'col':''}">${q.vals.map(v=>`<div class="num ${v===null?'hole':''}">${v===null?'?':v}</div>`).join('')}</div>`}

function syncImpact(from,animate){if(!game||game.mode!=='pk')return;const target=1-from,node=$('#hp'+target);if(!node)return;node.textContent='♥'.repeat(game.hp[target])+'♡'.repeat(5-game.hp[target]);node.setAttribute('aria-label',game.hp[target]+' HP');feedback('命中！HP −1','#feed'+target);if(animate){const side=$('#side'+target);side.classList.add('hit');const avatar=side.querySelector('.pet'),r=avatar.getBoundingClientRect();const p=pokemonLibrary[game.duelPicks[from]],layer=$('#effects');layer.insertAdjacentHTML('beforeend',`<span class="impact" style="left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;--fx-color:${p.color}"></span><span class="damage-pop" style="left:${r.left+r.width/2}px;top:${r.top}px">−1 HP</span>`)}}

function answer(v,player){if(screen!=='play'||!game||paused||game.locked)return;const now=performance.now(),q=game.q;if(game.mode==='pk'&&now<game.freeze[player-1])return;if(q.selected.includes(v))return;game.attempts++;if(!q.answers.includes(v)){game.questionWrong=true;game.combo=0;sound('wrong');if(game.mode==='pk'){const i=player-1;game.freeze[i]=now+1000;feedback('差一点，观察 1 秒再出招！','#feed'+i);const overlay=document.createElement('div');overlay.className='freeze';overlay.textContent='❄ 观察一下 · 1 秒';$('#side'+i).append(overlay);const token=game.sessionId;setTimeout(()=>{if(game&&game.sessionId===token)overlay.remove()},1000)}else{feedback('差一点！再观察一下数字！');$('#combo').textContent='Combo ×0'}return}
q.selected.push(v);if(q.selected.length<q.answers.length){const btn=$(`[data-answer="${v}"]`);btn.classList.add('chosen');btn.disabled=true;sound('correct');feedback('找到一个啦！再找另一个数字。');return}
game.locked=true;game.correct++;game.completed++;if(!game.questionWrong)game.first++;const elapsed=Math.max(.01,(now-qStart)/1000);game.times.push(elapsed);game.combo=game.questionWrong?0:game.combo+1;game.maxCombo=Math.max(game.maxCombo,game.combo);game.lastTime=elapsed;
if(game.mode==='pk'){const i=player-1;game.hp[1-i]--;const wait=launchAttack(i);later(()=>{if(!game)return;syncImpact(i,false);clearAttack();if(game.hp[1-i]===0){game.winner=player;finish('pk')}else nextQuestion()},wait);return}

const stars=elapsed<=2?'★★★★★ 神速！':elapsed<=4?'★★★★ 太棒了！':elapsed<=6?'★★★ 不错！':'★★ 找到数字线索啦！';let skill=game.combo>=10&&game.combo%10===0?'效果拔群！':game.combo%5===0&&game.combo>0?pets[partner][3]:game.combo%3===0&&game.combo>0?pets[partner][2]:'';feedback(`${skill?pets[partner][0]+'使出了'+skill+'！ ':stars+' '}${elapsed.toFixed(1)}秒`);$('#combo').textContent='Combo ×'+game.combo;sound(skill?'combo':'correct');if(game.boss){const damage=elapsed<=3&&!game.questionWrong?2:1;game.bossHP=Math.max(0,game.bossHP-damage);$('#bosshp').style.width=game.bossHP*10+'%';$('#progresslabel').textContent=`HP ${game.bossHP} / 10 · ${damage===2?'暴击！伤害 ×2':'命中！伤害 +1'}`}
later(()=>{if(!game)return;if(game.boss){if(game.bossHP<=0)finish('win');else nextQuestion()}else{game.index++;if(game.index>=10){if(game.gym===4)bossIntro();else finish('win')}else nextQuestion()}},850)}
function bossIntro(){screen='bossintro';mount(`<section class="result panel"><div style="height:220px">${pet('boss')}</div><h2>最后的挑战 · 喷火龙 Boss</h2><p>你已经集齐数字能量！</p><p>找对一次：伤害 1；首次答对且 ≤3 秒：暴击 ×2。</p><p class="muted">Boss 有 10 HP。答错也没关系，观察后继续！</p><button class="primary" data-action="boss">挑战 Boss！</button></section>`);sound('combo')}
function recordGame(status){if(!game||game.saved||!game.attempts)return null;tick();game.saved=true;const g=game;const rec={date:new Date().toISOString(),mode:g.mode,gym:g.gym,status,questions:g.completed,attempts:g.attempts,accuracy:g.completed?Math.round(g.first/g.completed*100):0,avg:avg(g.times),best:g.times.length?Math.min(...g.times):null,combo:g.maxCombo,ms:g.duration,winner:g.winner||null};const d=today();d.ms+=g.duration;d.questions+=g.completed;d.attempts+=g.attempts;d.correct+=g.first;db.daily[dayKey()]=d;const days=Object.keys(db.daily);if(days.length>30)delete db.daily[days[0]];db.records.unshift(rec);db.records=db.records.slice(0,7);db.exp+=g.completed*10+(status==='win'?30:0);db.bestCombo=Math.max(db.bestCombo,g.maxCombo);if(rec.best!==null)db.best=db.best===null?rec.best:Math.min(db.best,rec.best);if(status==='win'&&g.mode==='solo'){if(!db.badges.includes(g.gym))db.badges.push(g.gym);db.unlocked=Math.min(4,Math.max(db.unlocked,g.gym+1))}save();return rec}
function finish(status){clearTimeout(transition);const prev=db.records.find(r=>r.mode===game.mode&&r.gym===game.gym&&r.avg!==null);recordGame(status);screen='result';sound('win');const g=game,mean=avg(g.times),faster=prev&&mean!==null&&mean<prev.avg;mount(`<section class="result panel"><div class="eyebrow">GREAT JOB, TRAINER!</div><div class="medal">${status==='win'?'🏅':status==='pk'?'🏆':'🌟'}</div><h2>${status==='pk'?`玩家 ${g.winner}，对战胜利！`:status==='win'?'道馆挑战成功！':'今天也有新进步！'}</h2><p>${status==='pk'?'你赢得了训练家对战！握握手，再来一局？':status==='win'?'训练家获得一枚道馆徽章！':'训练记录已经保存，休息一下眼睛吧。'}</p>${stats([[g.completed,'本次完成题目'],[g.completed?Math.round(g.first/g.completed*100)+'%':'—','首次答对率'],[fmt(mean),'平均找数速度'],[g.maxCombo,'最高 Combo']])}<div class="microstats"><span>最快：${fmt(g.times.length?Math.min(...g.times):null)}</span><span>今日训练：${(today().ms/60000).toFixed(1)} 分钟</span><span>今日完成：${today().questions} 题</span></div><p style="color:#378566">${faster?'今天你的找数速度超过了自己的上一次记录！':g.mode==='solo'&&status==='win'&&g.gym<4?`新道馆已解锁：${gyms[g.gym+1][0]}，等你来探险！`:'先准确，再快速；每一次观察都在进步！'}</p><div class="buttons">${status==='rest'?'':`<button class="primary" data-action="${g.mode==='pk'?'rematch':status==='win'&&g.gym<4?'nextgym':'replay'}">${g.mode==='pk'?'再战一次':status==='win'&&g.gym<4?'前往下一道馆':'再练一次'}</button>`}${g.mode==='pk'?'<button class="secondary" data-action="pksetup">更换宝可梦 / 难度</button>':''}<button class="secondary" data-action="home">返回首页</button><button class="secondary" data-action="records">训练记录</button></div><p class="muted">首次答对率按整题统计；双人数据为双方合计。速度包含重试。</p>${!storageOK?'<div class="warning">当前浏览器无法持久保存，请保持此页面打开。</div>':''}</section>`)}
function records(){screen='records';mount(`<div class="title-row"><div><div class="eyebrow">TRAINER JOURNAL</div><h2>每次进步，都值得一枚星星</h2><span class="muted">最近 7 次训练 · 保存在当前浏览器</span></div><span class="tag">Lv. ${level()} · EXP ${db.exp}</span></div>${stats([[(today().ms/60000).toFixed(1)+'分','今日训练'],[today().questions,'今日完成题目'],[db.bestCombo,'历史最高连击'],[fmt(db.best),'历史最快']])}<section class="panel" style="margin-top:20px"><div class="record muted"><span>训练旅程</span><span>完成 / 正确率</span><span>平均 / 最快</span><span>连击 / 时长</span></div>${db.records.length?db.records.map(r=>`<div class="record"><span><b>${r.mode==='pk'?'双人对战':gyms[r.gym][0]}</b><br><small>${new Date(r.date).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})} · ${r.status==='win'?'获徽章':r.status==='pk'?'玩家'+r.winner+'胜':'训练存档'}</small></span><span>${r.questions}题 / ${r.accuracy}%</span><span>${fmt(r.avg)} / ${fmt(r.best)}</span><span>×${r.combo} / ${(r.ms/60000).toFixed(1)}分</span></div>`).join(''):'<p style="text-align:center;padding:35px">你的冒险日志还是空白的。去森林找找数字吧！ 🌿</p>'}</section><p class="muted">正确率 = 无重试答对的整题数 ÷ 完成题数；双人数据为双方合计，未完成题不计入。</p>`)}
function settings(){screen='settings';const s=db.settings;mount(`<section class="settings panel"><div class="eyebrow">PARENT SETTINGS</div><h2>小习惯，大进步</h2><p class="muted">先准确，再快速。建议一次只练一个道馆。</p>${[['minutes','每天训练',[['5','5 分钟'],['10','10 分钟'],['15','15 分钟']]],['difficulty','难度',[['easy','简单'],['standard','标准'],['challenge','挑战']]],['range','数字范围',[['auto','自动升级'],['4','1～4'],['6','1～6'],['9','1～9']]],['sound','声音',[['true','开'],['false','关']]],['animation','动画',[['true','开'],['false','关']]]].map(([key,label,opts])=>`<div class="setting"><label for="set-${key}">${label}</label><select id="set-${key}" data-setting="${key}">${opts.map(([v,l])=>`<option value="${v}" ${String(s[key])===v?'selected':''}>${l}</option>`).join('')}</select></div>`).join('')}<p class="muted">简单：以单空缺为主。标准：循序加入乱序、双空缺与宫格。挑战：乱序起步，冠军关增加多空缺题。</p><p class="muted">达到每日时长会提醒休息；继续训练可由家长决定。暂停或切换到后台不计时。</p><button class="primary" data-action="saveSettings" style="width:100%">保存设置</button><p class="muted">离线使用：不收集、不上传任何训练数据。浏览器清理网站数据会清除存档。</p></section>`)}
function dialog(title,body,buttons){$('#modal').innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-label="${title}"><div class="dialog"><h2>${title}</h2><p>${body}</p><div class="buttons">${buttons.map(([action,label])=>`<button class="${action==='resume'?'primary':'secondary'}" data-action="${action}">${label}</button>`).join('')}</div></div></div>`;$('#modal button')?.focus()}
function pause(kind='pause'){if(paused||screen!=='play')return;tick();paused=true;clearTimeout(impactTimer);document.body.classList.add('battle-paused');pauseAt=performance.now();dialog(kind==='back'?'先休息一下？':'训练家补给站',kind==='back'?'已完成的题目会保存，下次可重新挑战本道馆。':'休息时不计时，准备好了再出发。',[[kind==='back'?'exit':'resume',kind==='back'?'保存并回首页':'继续训练'],[kind==='back'?'resume':'exit',kind==='back'?'继续挑战':'保存并回首页']])}
function resume(){document.body.classList.remove('battle-paused');if(paused){const delta=performance.now()-pauseAt;qStart+=delta;lastTick=performance.now();paused=false}$('#modal').innerHTML='';if(pending){clearTimeout(transition);const fn=pending;pending=null;fn()}}
function tick(){const now=performance.now();if(game&&screen==='play'&&!paused&&active&&!game.saved){game.duration+=Math.max(0,now-lastTick);const clock=$('#clock');if(clock&&!game.locked)clock.textContent=((now-qStart)/1000).toFixed(1)+'秒'}lastTick=now}
function dailyCheck(){if(!game||screen!=='play'||paused||game.locked||game.dailyNotified)return;if(today().ms+game.duration>=db.settings.minutes*60000){game.dailyNotified=true;pause();dialog('今天的数字能量充满啦！',`已经训练 ${db.settings.minutes} 分钟。看看远处，让眼睛休息一下吧。`,[['rest','保存并休息'],['resume','家长同意，继续']])}}
setInterval(()=>{tick();dailyCheck()},100);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(screen==='play')pause();active=false}else{active=true;lastTick=performance.now()}});
window.addEventListener('pagehide',()=>{recordGame('interrupted')});
window.addEventListener('pageshow',e=>{if(e.persisted&&game?.saved){paused=false;$('#modal').innerHTML='';home()}});
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-answer]');if(b){e.preventDefault();answer(+b.dataset.answer,+b.dataset.player)}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.answer){if(e.detail===0)answer(+b.dataset.answer,+b.dataset.player);return}const a=b.dataset.action;if(!a)return;if(a==='sound'){db.settings.sound=!db.settings.sound;save();b.textContent=db.settings.sound?'♪ 声音开':'♬ 已静音';if(db.settings.sound)sound('correct');return}
if(a==='home')home();else if(a==='back'){if(screen==='play')pause('back');else if(screen==='bossintro'){recordGame('interrupted');home()}else home()}else if(a==='map')map();else if(a==='partner'){partner=+b.dataset.i;map()}else if(a==='gym')start('solo',+b.dataset.i);else if(a==='pksetup')pksetup();else if(a==='duelpet'){const player=+b.dataset.player,i=+b.dataset.i;if([0,1].includes(player)&&pokemonLibrary[i]){duelPicks[player]=i;rememberDuel();$('#roster'+player).outerHTML=rosterHTML(player)}}else if(a==='duelrange'){duelRange=+b.dataset.n===9?9:6;rememberDuel();document.querySelectorAll('[data-action="duelrange"]').forEach(el=>el.setAttribute('aria-pressed',String(+el.dataset.n===duelRange)));$('[data-action="pkstart"]').textContent='⚔ 开始对战 · 1～'+duelRange}else if(a==='pkstart'){start('pk',0,duelRange)}else if(a==='records')records();else if(a==='settings')settings();else if(a==='saveSettings'){document.querySelectorAll('[data-setting]').forEach(el=>{const k=el.dataset.setting;db.settings[k]=k==='minutes'?+el.value:['sound','animation'].includes(k)?el.value==='true':el.value});save();home()}else if(a==='pause')pause();else if(a==='resume')resume();else if(a==='exit'){recordGame('interrupted');paused=false;$('#modal').innerHTML='';home()}else if(a==='rest'){$('#modal').innerHTML='';finish('rest');paused=false}else if(a==='boss'){screen='play';game.boss=true;game.index=0;nextQuestion()}else if(a==='rematch')start('pk',0,game.n);else if(a==='replay')start('solo',game.gym);else if(a==='nextgym')start('solo',Math.min(4,game.gym+1));});
home();
</script></body></html>
